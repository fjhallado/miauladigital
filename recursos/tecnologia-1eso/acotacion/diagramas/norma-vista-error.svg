<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 158" role="img" aria-labelledby="title">
  <title id="title">El diámetro 16 se sitúa sobre las aristas ocultas del alzado</title>
  <style>
    .outline { fill: #e3edf7; stroke: #273f58; stroke-width: 2.8; stroke-linejoin: round }
    .hole { fill: #f7faff }
    .aux, .dim, .axis, .hidden { fill: none; stroke: #6c839a; stroke-width: .9 }
    .dim { stroke: #215980; stroke-width: 1.15 }
    .axis { stroke-dasharray: 7 2 1 2 }
    .hidden { stroke: #536d8b; stroke-width: 1.3; stroke-dasharray: 4 3 }
    .arrow { fill: #215980 }
    .measure, .view { fill: #15476d; font: 700 13px system-ui, sans-serif; text-anchor: middle }
    .view { fill: #3d566d; font-size: 14px; font-weight: 600; text-anchor: start }
    .error .dim { stroke: #9d3442 }
    .error .arrow, .error .measure { fill: #972e3a }
  </style>
  <rect width="340" height="158" rx="8" fill="#f7faff"/>
  <rect class="outline" x="63" y="19" width="153" height="43"/>
  <rect class="outline" x="63" y="82" width="153" height="60"/>
  <path class="hidden" d="M123.5 21L123.5 60"/>
  <path class="hidden" d="M155.5 21L155.5 60"/>
  <circle class="outline hole" cx="139.5" cy="112" r="16"/>
  <path class="axis" d="M115 112L164 112"/>
  <path class="axis" d="M139.5 88L139.5 136"/>
  <text class="view" x="239" y="45">Alzado</text>
  <text class="view" x="245" y="109">Planta</text>
  <g class="error">
