    <polygon class="arrow" points="123.5,49 129.5,51.3 129.5,46.7"/>
    <polygon class="arrow" points="155.5,49 149.5,46.7 149.5,51.3"/>
    <text class="measure" x="139.5" y="45">Ø16</text>
