<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 158" role="img" aria-labelledby="title">
  <title id="title">El ancho de 70 se repite en alzado y planta</title>
  <style>
    .outline { fill: #e3edf7; stroke: #273f58; stroke-width: 2.8; stroke-linejoin: round }
    .hole { fill: #f7faff }
    .aux, .dim, .axis, .hidden { fill: none; stroke: #6c839a; stroke-width: .9 }
    .dim { stroke: #215980; stroke-width: 1.15 }
    .axis { stroke-dasharray: 7 2 1 2 }
    .hidden { stroke: #536d8b; stroke-width: 1.3; stroke-dasharray: 4 3 }
    .arrow { fill: #215980 }
    .measure, .view { fill: #15476d; font: 700 13px system-ui, sans-serif; text-anchor: middle }
    .view { fill: #3d566d; font-size: 14px; font-weight: 600; text-anchor: start }
    .error .dim { stroke: #9d3442 }
    .error .arrow, .error .measure { fill: #972e3a }
  </style>
  <rect width="340" height="158" rx="8" fill="#f7faff"/>
  <rect class="outline" x="65" y="40" width="147" height="31"/>
  <rect class="outline" x="65" y="87" width="147" height="35"/>
  <text class="view" x="232" y="61">Alzado</text>
  <text class="view" x="232" y="110">Planta</text>
  <path class="aux" d="M65 125L65 150"/>
  <path class="aux" d="M212 125L212 150"/>
  <path class="dim" d="M65 145L212 145"/>
  <polygon class="arrow" points="65,145 71,147.3 71,142.7"/>
  <polygon class="arrow" points="212,145 206,142.7 206,147.3"/>
  <text class="measure" x="138.5" y="141">70</text>
  <g class="error">
    <path class="aux" d="M65 37L65 14"/>
    <path class="aux" d="M212 37L212 14"/>
    <path class="dim" d="M65 19L212 19"/>
    <polygon class="arrow" points="65,19 71,21.3 71,16.7"/>
    <polygon class="arrow" points="212,19 206,16.7 206,21.3"/>
    <text class="measure" x="138.5" y="15">70</text>
  </g>
</svg>
