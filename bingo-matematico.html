<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Matemático | Mi Aula Digital</title><link rel="stylesheet" href="estilos.css"><script src="config-juegos.js"></script><body><header class="site-header"><div class="container header-row"><a class="branding" href="index.html"><span><strong>Mi Aula Digital</strong><small>Francisco José Hallado Fernández</small></span></a><a class="btn secondary" href="laboratorio.html">Volver al Laboratorio</a></div></header><main class="container section"><span class="eyebrow">MATEMÁTICAS · MULTIJUGADOR</span><h1>Bingo Matemático</h1><p>Resuelve operaciones, marca los resultados y canta línea o bingo. El profesor crea la sala y controla las bolas.</p><p id="info"></p><label for="server">Dirección HTTPS del servidor de juego</label><input id="server" type="url" placeholder="https://tu-servidor.onrender.com" style="display:block;width:100%;max-width:650px;padding:12px;margin:12px 0"><button class="btn" id="open">Abrir Bingo Matemático</button><p id="error" role="status"></p></main><script>const field=document.getElementById('server');field.value=window.AULA_JUEGOS?.bingoUrl||window.AULA_JUEGOS?.impostorUrl||localStorage.getItem('mad-bingo-server')||'';document.getElementById('info').textContent=field.value?'Conecta al servidor para crear una sala o unirte.':'Introduce la dirección del servidor Render donde está desplegado classroom-impostor.';document.getElementById('open').onclick=()=>{try{const u=new URL(field.value);if(u.protocol!=='https:')throw Error();localStorage.setItem('mad-bingo-server',u.origin);location.href=new URL('/bingo.html',u.origin).href}catch{document.getElementById('error').textContent='Introduce una dirección HTTPS válida.'}};</script></body></html>
