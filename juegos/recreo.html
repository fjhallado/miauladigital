<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minijuegos · Cafetería · Mi Aula Digital</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#eef6ff;background:#071426}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#14335a,#071426 70%)}header{padding:16px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;background:#0d2441}a{color:#9ddfff;text-decoration:none}.wrap{max-width:1080px;margin:25px auto;padding:0 15px}h1{margin:0 0 8px}p{color:#b8cce5}.choice{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.choice button,.actions button{padding:12px 15px;border:1px solid #476c9b;border-radius:10px;background:#183862;color:white;font-weight:700;cursor:pointer}.choice button.selected{background:#2579be;border-color:#80deff}.stage{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}.canvasbox{flex:1;min-width:290px}canvas{display:block;width:100%;height:auto;border:3px solid #4b91d8;border-radius:14px;background:#122b49;touch-action:none}.sidebar{width:230px;max-width:100%;border:1px solid #31557a;border-radius:12px;padding:16px;background:#0e2742}.sidebar strong{color:#fff}.actions{display:flex;gap:9px;margin:13px 0;flex-wrap:wrap}.touch{display:flex;gap:14px;justify-content:center;margin:12px 0}.touch button{width:70px;height:52px;border-radius:12px;background:#184775;color:white;border:1px solid #6abbed;font-size:25px;touch-action:none}#message{font-weight:700;color:#ffdf7a;min-height:44px}.hidden{display:none!important}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.memory-card{aspect-ratio:1;background:#1b4770;color:white;border:2px solid #4fa1dd;border-radius:10px;font-size:2rem;cursor:pointer}.memory-card.shown,.memory-card.matched{background:#e4f4ff;color:#112947}.memory-card.matched{opacity:.55}@media(max-width:550px){.cards{grid-template-columns:repeat(4,1fr)}.sidebar{width:100%}header{padding:15px}}
</style></head><body><header><strong>Cafetería · Mi Aula Digital</strong><a href="../cafeteria.html">← Volver a Cafetería</a></header><main class="wrap"><h1>Minijuegos para desconectar</h1><p>Selecciona un juego. Usa A/D o las flechas para moverte, y espacio para lanzar cuando corresponda.</p><div class="choice"><button data-mode="esquiva">🎒 Esquiva al profe</button><button data-mode="lluvia">📚 Lluvia de exámenes</button><button data-mode="bloques">🧱 Rompebloques</button><button data-mode="memoria">🧠 Memoria escolar</button></div><div class="stage"><div class="canvasbox"><canvas id="game" width="800" height="480" aria-label="Área del videojuego"></canvas><div id="cards" class="cards hidden"></div><div class="touch" id="touch"><button data-key="ArrowLeft" aria-label="Mover izquierda">◀</button><button data-key="Space" aria-label="Acción">●</button><button data-key="ArrowRight" aria-label="Mover derecha">▶</button></div></div><aside class="sidebar"><h2 id="title">Elige un juego</h2><p id="description"></p><div id="hud"></div><div class="actions"><button id="start">▶ Empezar / Reiniciar</button><button id="pause">⏸ Pausar</button></div><p id="message" aria-live="polite"></p><p><small>Los juegos se ejecutan en tu navegador, sin cuentas ni clasificaciones públicas.</small></p></aside></div></main><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height,keys=new Set();let mode='esquiva',running=false,paused=false,last=0,elapsed=0,spawn=0,score=0,life=3,level=1,ball=null,blocks=[],drops=[],shots=[],player={x:400,y:420,w:64,h:35},enemies=[],power=0,goal=10,deck=[],flipped=[],matched=0,moves=0;
const $=id=>document.getElementById(id),descs={esquiva:'Recoge notas positivas hasta sumar 10. Evita los ceros lanzados por los profesores. Las notas negativas restan puntos y desaparecen a los 3 segundos.',lluvia:'Mueve al alumno y lanza ejercicios contra los exámenes que caen. Recoge corazones, escudos y mejoras de disparo.',bloques:'Mueve la plataforma para devolver la pelota y romper todos los bloques. ¡No dejes que caiga!',memoria:'Encuentra parejas de objetos escolares con el menor número de intentos posible.'},names={esquiva:'Esquiva al profe',lluvia:'Lluvia de exámenes',bloques:'Rompebloques',memoria:'Memoria escolar'};
function choose(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===m));$('title').textContent=names[m];$('description').textContent=descs[m];$('cards').classList.toggle('hidden',m!=='memoria');c.classList.toggle('hidden',m==='memoria');$('touch').classList.toggle('hidden',m==='memoria');start()}
function initBlocks(){blocks=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)blocks.push({x:24+col*76,y:45+r*36,w:70,h:27,hp:1+(r===0?1:0),tone:r})}
function start(){running=true;paused=false;elapsed=spawn=score=0;life=3;level=1;power=0;goal=10;player={x:400,y:428,w:72,h:32};drops=[];shots=[];enemies=[];ball={x:400,y:300,vx:160,vy:-225,r:9};if(mode==='bloques')initBlocks();if(mode==='memoria')startMemory();$('pause').textContent='⏸ Pausar';$('message').textContent='¡A jugar!';hud()}
function hud(){let t=mode==='esquiva'?`Nota: ${score} / ${goal} · Vidas: ${life} · Nivel: ${level}`:mode==='lluvia'?`Puntos: ${score} · Vidas: ${life} · Mejora: ${Math.max(0,Math.ceil(power))} s`:mode==='bloques'?`Bloques: ${blocks.length} · Vidas: ${life}`:`Parejas: ${matched}/8 · Intentos: ${moves}`;$('hud').textContent=t}
function lose(msg){running=false;$('message').textContent=msg+' · Pulsa Empezar para jugar de nuevo.'}
const rnd=(a,b)=>a+Math.random()*(b-a),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function drawBase(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#173c66');g.addColorStop(1,'#235e7c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#244766';for(let i=0;i<14;i++){let x=i*63;ctx.fillRect(x,130-(i%4)*25,51,230+(i%4)*25);ctx.fillStyle='#a0c8e1';for(let yy=155-(i%4)*25;yy<350;yy+=35)for(let xx=x+9;xx<x+50;xx+=22)ctx.fillRect(xx,yy,9,14);ctx.fillStyle='#244766'}ctx.fillStyle='#485d6e';ctx.fillRect(0,452,W,28);ctx.fillStyle='#cbd7e0';for(let x=0;x<W;x+=75)ctx.fillRect(x,461,40,4)}
function actor(x,y,kind){ctx.font='43px system-ui';ctx.textAlign='center';ctx.fillText(kind,x,y)}
function tick(dt){elapsed+=dt;if(mode==='esquiva'||mode==='lluvia'){
const vel=340*dt;if(keys.has('ArrowLeft')||keys.has('KeyA'))player.x-=vel;if(keys.has('ArrowRight')||keys.has('KeyD'))player.x+=vel;player.x=Math.max(35,Math.min(W-35,player.x));spawn+=dt;
if(spawn>(mode==='esquiva'?.65:.47)){spawn=0;const x=rnd(38,W-38);if(mode==='esquiva'){let chance=Math.random(),item=chance<.28?'zero':chance<.43?'neg':'pos';drops.push({x,y:-25,v:rnd(120,205)+level*16,kind:item,value:item==='pos'?(Math.random()<.3?2:1):item==='neg'?(Math.random()<.4?-2:-1):0,ttl:3})}else{let chance=Math.random();drops.push({x,y:-25,v:rnd(145,240),kind:chance<.10?'heart':chance<.20?'boost':chance<.26?'shield':'exam',ttl:6})}}
if(mode==='lluvia'&&(keys.has('Space')||keys.has('KeyK'))&&elapsed%0.20<dt)shots.push({x:player.x,y:407,v:-500});
for(const d of drops){d.y+=d.v*dt;d.ttl-=dt;if(Math.abs(d.x-player.x)<37&&Math.abs(d.y-414)<37){d.dead=true;if(mode==='esquiva'){if(d.kind==='zero')life--;else score=Math.max(0,score+d.value)}else if(d.kind==='exam'){life--}else if(d.kind==='heart')life=Math.min(5,life+1);else if(d.kind==='boost')power=10;else if(d.kind==='shield')life=Math.min(5,life+1)}}
for(const s of shots){s.y+=s.v*dt;for(const d of drops){if(d.kind==='exam'&&!d.dead&&Math.abs(d.x-s.x)<27&&Math.abs(d.y-s.y)<26){d.dead=true;s.dead=true;score+=10;break}}}shots=shots.filter(s=>!s.dead&&s.y>-20);drops=drops.filter(d=>!d.dead&&d.y<480&&d.ttl>0);if(mode==='esquiva'&&score>=goal){level++;goal+=10;score=Math.max(score,goal-10);$('message').textContent='¡Aprobado! Siguiente nivel: alcanza '+goal}if(power>0)power-=dt;if(life<=0)lose('Fin de la partida');}
else if(mode==='bloques'){
const vel=450*dt;if(keys.has('ArrowLeft')||keys.has('KeyA'))player.x-=vel;if(keys.has('ArrowRight')||keys.has('KeyD'))player.x+=vel;player.x=Math.max(60,Math.min(740,player.x));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.y>H+20){life--;ball={x:player.x,y:300,vx:rnd(-180,180)||130,vy:-230,r:9};if(life<=0)lose('Se acabaron las vidas')}
let pad={x:player.x-61,y:425,w:122,h:20};if(ball.vy>0&&hit({x:ball.x-9,y:ball.y-9,w:18,h:18},pad)){ball.vy=-Math.abs(ball.vy);ball.vx=(ball.x-player.x)*4.3}
for(const b of blocks){if(hit({x:ball.x-9,y:ball.y-9,w:18,h:18},b)){ball.vy*=-1;b.hp--;if(b.hp<=0){b.dead=true;score+=10}break}}blocks=blocks.filter(b=>!b.dead);if(!blocks.length){level++;initBlocks();$('message').textContent='¡Nivel '+level+'!'}}hud()}
function render(){drawBase();if(mode==='esquiva'||mode==='lluvia'){actor(player.x,435,'🧑‍🎓');if(mode==='esquiva'){for(let i=0;i<4;i++)actor(105+i*190,110,'👨‍🏫');for(const d of drops){ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.fillStyle=d.kind==='pos'?'#95ffb2':d.kind==='neg'?'#ffb08e':'#ffdce8';ctx.fillText(d.kind==='zero'?'0':(d.value>0?'+':'')+d.value,d.x,d.y)}}else{for(const d of drops)actor(d.x,d.y,{exam:'📄',heart:'❤️',boost:'⚡',shield:'🛡️'}[d.kind]);ctx.fillStyle='#ffed93';for(const s of shots)ctx.fillRect(s.x-3,s.y-15,6,22)}}else if(mode==='bloques'){ctx.fillStyle='#ffdf87';ctx.fillRect(player.x-61,425,122,19);ctx.beginPath();ctx.fillStyle='#f7faff';ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();const col=['#f98a7c','#fbb971','#ffdb79','#7dd9bc','#82b9ff'];for(const b of blocks){ctx.fillStyle=col[b.tone];ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffffff55';ctx.fillRect(b.x+3,b.y+3,b.w-6,4)}}}
function frame(ts){let dt=Math.min((ts-last)/1000||.016,.04);last=ts;if(running&&!paused&&mode!=='memoria')tick(dt);if(mode!=='memoria')render();requestAnimationFrame(frame)}
function startMemory(){const icons=['📐','📚','✏️','🧪','💻','🎒','📏','🔬'];deck=[...icons,...icons].map((emoji,id)=>({emoji,id,shown:false,matched:false}));for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}flipped=[];matched=0;moves=0;renderMemory()}
function renderMemory(){$('cards').replaceChildren();deck.forEach((d,i)=>{let b=document.createElement('button');b.className='memory-card'+(d.shown?' shown':'')+(d.matched?' matched':'');b.textContent=d.shown||d.matched?d.emoji:'?';b.addEventListener('click',()=>{if(!running||paused||d.shown||d.matched||flipped.length>=2)return;d.shown=true;flipped.push(i);renderMemory();if(flipped.length===2){moves++;const [a,z]=flipped;if(deck[a].emoji===deck[z].emoji){deck[a].matched=deck[z].matched=true;flipped=[];matched++;if(matched===8){running=false;$('message').textContent='¡Todas las parejas encontradas!'}}else{setTimeout(()=>{deck[a].shown=deck[z].shown=false;flipped=[];renderMemory()},900)}hud()}});$('cards').append(b)});hud()}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyK'].includes(e.code)){e.preventDefault();keys.add(e.code)}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const code=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(code))});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.mode)));$('start').addEventListener('click',start);$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶ Reanudar':'⏸ Pausar'});choose(['esquiva','lluvia','bloques','memoria'].includes(location.hash.slice(1))?location.hash.slice(1):'esquiva');requestAnimationFrame(frame);
})();</script></body></html>
